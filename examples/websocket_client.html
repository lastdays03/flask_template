<!DOCTYPE html>
<html>

<head>
    <title>WebSocket Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.js"></script>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .container {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }

        #messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            margin-top: 10px;
        }

        .message {
            margin: 5px 0;
            padding: 5px;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .status {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .connected {
            color: green;
        }

        .disconnected {
            color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>WebSocket Test</h1>
        <div id="status" class="status disconnected">Disconnected</div>

        <div>
            <label>JWT Token:</label>
            <input type="text" id="token" placeholder="Enter JWT Token" style="width: 100%; margin-bottom: 10px;">
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>

        <div style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 20px;">
            <h3>Test Messaging</h3>
            <input type="text" id="messageInput" placeholder="Type a message..." style="width: 70%;">
            <button onclick="sendMessage()">Send Test Message</button>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 20px;">
            <div style="flex: 1;">
                <h3>Sent Messages (ACK)</h3>
                <div id="sentMessages" style="height: 300px; overflow-y: auto; border: 1px solid #eee; padding: 10px;">
                </div>
            </div>
            <div style="flex: 1;">
                <h3>Received Messages</h3>
                <div id="receivedMessages"
                    style="height: 300px; overflow-y: auto; border: 1px solid #eee; padding: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;

        function connect() {
            const token = document.getElementById('token').value;
            if (!token) {
                alert('Please enter a JWT token');
                return;
            }

            if (socket) {
                socket.disconnect();
            }

            socket = io('http://localhost', {
                auth: { token: token },
                transports: ['websocket', 'polling']
            });

            socket.on('connect', () => {
                const status = document.getElementById('status');
                status.textContent = 'Connected';
                status.className = 'status connected';
                logToAll('System', 'Connected to server');
            });

            socket.on('connected', (data) => {
                logToReceived('Server', data.message);
            });

            socket.on('new_message', (data) => {
                // Display in Received area
                logToReceived('User', `${data.message} (Room: ${data.room})`);
            });

            socket.on('message_sent_ack', (data) => {
                // Display in Sent area
                logToSent('Server ACK', `Sent: "${data.echo}" to ${data.room} (Status: ${data.status})`);
            });

            socket.on('notification', (data) => {
                logToReceived('Notification', data.message);
            });

            socket.on('disconnect', () => {
                const status = document.getElementById('status');
                status.textContent = 'Disconnected';
                status.className = 'status disconnected';
                logToAll('System', 'Disconnected from server');
            });

            socket.on('connect_error', (error) => {
                logToAll('System', 'Connection error: ' + error.message);
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
            }
        }

        function sendMessage() {
            if (!socket) {
                alert('Not connected!');
                return;
            }
            const input = document.getElementById('messageInput');
            const message = input.value;
            if (message) {
                socket.emit('send_message', {
                    message: message,
                    room: 'general'
                });
                input.value = '';
            }
        }

        function logToSent(source, text) {
            addMessage('sentMessages', source, text);
        }

        function logToReceived(source, text) {
            addMessage('receivedMessages', source, text);
        }

        function logToAll(source, text) {
            logToSent(source, text);
            logToReceived(source, text);
        }

        function addMessage(elementId, source, text) {
            const container = document.getElementById(elementId);
            if (!container) return;
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<strong>${source}:</strong> ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>

</html>
