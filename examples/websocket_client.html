<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #eee; padding: 10px; margin-top: 10px; }
        .message { margin: 5px 0; padding: 5px; background: #f9f9f9; border-radius: 4px; }
        .status { font-weight: bold; margin-bottom: 10px; }
        .connected { color: green; }
        .disconnected { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Test</h1>
        <div id="status" class="status disconnected">Disconnected</div>
        
        <div>
            <label>JWT Token:</label>
            <input type="text" id="token" placeholder="Enter JWT Token" style="width: 100%; margin-bottom: 10px;">
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>

        <div style="margin-top: 20px;">
            <h3>Messages</h3>
            <div id="messages"></div>
        </div>
    </div>

    <script>
        let socket = null;

        function connect() {
            const token = document.getElementById('token').value;
            if (!token) {
                alert('Please enter a JWT token');
                return;
            }

            if (socket) {
                socket.disconnect();
            }

            socket = io('http://localhost:5000', {
                auth: { token: token },
                transports: ['websocket', 'polling']
            });

            socket.on('connect', () => {
                const status = document.getElementById('status');
                status.textContent = 'Connected';
                status.className = 'status connected';
                addMessage('System', 'Connected to server');
            });

            socket.on('connected', (data) => {
                addMessage('Server', data.message);
            });

            socket.on('notification', (data) => {
                addMessage('Notification', data.message);
            });

            socket.on('disconnect', () => {
                const status = document.getElementById('status');
                status.textContent = 'Disconnected';
                status.className = 'status disconnected';
                addMessage('System', 'Disconnected from server');
            });

            socket.on('connect_error', (error) => {
                addMessage('System', 'Connection error: ' + error.message);
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
            }
        }

        function addMessage(source, text) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<strong>${source}:</strong> ${text}`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
