version: '3.8'

services:
  monitoring_postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - monitoring_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # networks:
    #   - glitchtip_net

  monitoring_redis:
    image: redis:7
    restart: unless-stopped
    # networks:
    #   - glitchtip_net

  monitoring_web:
    image: glitchtip/glitchtip:latest
    depends_on:
      - monitoring_postgres
      - monitoring_redis
    ports:
      - "40005:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - PORT=${PORT}
      - EMAIL_URL=${EMAIL_URL}
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}

    restart: unless-stopped
    # networks:
    #   - glitchtip_net

  monitoring_worker:
    image: glitchtip/glitchtip:latest
    command: ./bin/run-celery.sh
    depends_on:
      - monitoring_postgres
      - monitoring_redis
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - PORT=${PORT}
      - EMAIL_URL=${EMAIL_URL}
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}

    restart: unless-stopped
    # networks:
    #   - glitchtip_net

volumes:
  monitoring_postgres_data:


networks:
  default:
    external: true
    name: nginx-proxy
