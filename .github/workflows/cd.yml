name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/flask-template:${{ github.ref_name }}

  # -------------------------------------------------------------------------
  # [선택 사항] 실제 서버 배포 (Deployment)
  # 서버가 준비되면 아래 주석을 해제하고 Secrets를 설정하여 사용하세요.
  # -------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect and Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 홈 디렉토리로 이동 (안전장치)
            cd ~

            PROJECT_DIR="flask_template"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # 1. 소스 코드 준비 (Clone or Pull)
            if [ -d "$PROJECT_DIR" ]; then
              echo "Project exists. Pulling latest changes..."
              cd $PROJECT_DIR
              git pull origin main
            else
              echo "Project not found. Cloning..."
              git clone $REPO_URL $PROJECT_DIR
              cd $PROJECT_DIR
            fi

            # 2. .env 파일 자동 생성 (없으면 Secret 기반 생성)
            # 주의: GitHub Repository Secrets에 해당 값들이 등록되어 있어야 함
            if [ ! -f ".env" ]; then
              echo "Creating .env file..."
              cat <<EOF > .env
            FLASK_ENV=production
            SECRET_KEY=${{ secrets.FLASK_SECRET_KEY }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            CELERY_BROKER_URL=redis://redis:6379/1
            CELERY_RESULT_BACKEND=redis://redis:6379/1
            FLOWER_USER=${{ secrets.FLOWER_USER }}
            FLOWER_PASSWORD=${{ secrets.FLOWER_PASSWORD }}

            # MariaDB Settings (docker-compose에서 사용)
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}

            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            EOF
            fi

            # 3. 로그 폴더 권한 설정 (Permission Denied 방지)
            mkdir -p logs
            chmod 777 logs

            # 4. 서비스 실행 (Nginx 제외 - NPM 사용)
            docker compose pull
            # docker compose up -d
            docker compose up -d app mariadb redis celery_worker flower
            docker image prune -f
