services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flask_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - mariadb
      - redis
    volumes:
      - ./logs:/app/logs

  nginx:
    image: nginx:1.25-alpine
    container_name: flask_nginx
    restart: unless-stopped
    ports:
      - "40001:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - flower

  mariadb:
    container_name: flask_mariadb
    image: mariadb:10.8.3
    restart: unless-stopped
    ports:
      - "40002:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      - TZ=Asia/Seoul
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command: [ "mysqld", "--innodb-buffer-pool-size=256M", "--max-connections=50", "--innodb-flush-log-at-trx-commit=2", "--lower_case_table_names=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake" ]
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: flask_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "40003:6379"

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flask_celery_worker
    restart: unless-stopped
    command: celery -A celery_worker.celery worker --loglevel=info
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - mariadb
      - redis
    volumes:
      - ./logs:/app/logs

    healthcheck:
      test: [ "CMD-SHELL", "celery -A celery_worker.celery inspect ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flask_flower
    restart: unless-stopped
    command: celery -A celery_worker.celery flower --conf=flower_config.py
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - FLOWER_USER=${FLOWER_USER:-admin}
      - FLOWER_PASSWORD=${FLOWER_PASSWORD:-change_me}
      - FLOWER_PORT=5555
      - FLOWER_URL_PREFIX=/flower
    ports:
      - "40004:5555"
    depends_on:
      - redis
      - celery_worker

    volumes:
      - .:/app
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:5555/flower/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mariadb_data:
  redis_data:


networks:
  default:
    external: true
    name: nginx-proxy
