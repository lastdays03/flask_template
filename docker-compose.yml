services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flask_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - mariadb
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - backend
    ports:
      - "5000:5000"

  nginx:
    image: nginx:1.25-alpine
    container_name: flask_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - flower
    networks:
      - backend

  mariadb:
    container_name: flask_mariadb
    image: mariadb:10.8.3
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      - TZ=Asia/Seoul
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command: [ "mysqld", "--innodb-buffer-pool-size=256M", "--max-connections=50", "--innodb-flush-log-at-trx-commit=2", "--lower_case_table_names=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake" ]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: flask_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flask_celery_worker
    restart: unless-stopped
    command: celery -A celery_worker.celery worker --loglevel=info
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - mariadb
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - backend

  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flask_flower
    restart: unless-stopped
    command: celery -A celery_worker.celery flower --conf=flower_config.py
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - FLOWER_USER=${FLOWER_USER:-admin}
      - FLOWER_PASSWORD=${FLOWER_PASSWORD:-change_me}
      - FLOWER_PORT=5555
      - FLOWER_URL_PREFIX=/flower
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - backend
    volumes:
      - .:/app

volumes:
  mariadb_data:
  redis_data:


networks:
  backend:
    driver: bridge
