services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flask_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://flask_user:flask_password@mariadb:3306/flask_app
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - mariadb
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: flask_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - backend

  mariadb:
    container_name: flask_mariadb
    image: mariadb:10.8.3
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      - TZ=Asia/Seoul
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=flask_app
      - MYSQL_USER=flask_user
      - MYSQL_PASSWORD=flask_password
    command: [ "mysqld", "--innodb-buffer-pool-size=256M", "--max-connections=50", "--innodb-flush-log-at-trx-commit=2", "--lower_case_table_names=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake" ]
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: flask_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: flask_celery_worker
    restart: unless-stopped
    command: celery -A celery_worker.celery worker --loglevel=info
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://flask_user:flask_password@mariadb:3306/flask_app
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - mariadb
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - backend

volumes:
  mariadb_data:
  redis_data:


networks:
  backend:
    driver: bridge
