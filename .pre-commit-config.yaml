default_install_hook_types: [pre-push]
fail_fast: true
repos:
  - repo: https://github.com/psf/black
    rev: 25.12.0  # Use a recent stable version matching requirements if possible, or latest
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true

